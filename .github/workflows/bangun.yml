name: bangun

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  biner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Bangun program mandiri
        run: pyinstaller --onefile --name insjay --paths src masuk.py

      - name: Uji hasil
        run: dist/insjay versi

      - name: Unggah ke rilis
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/insjay
            dist/insjay.exe
